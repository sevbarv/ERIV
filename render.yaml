services:
  - type: web
    name: eriv-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: ERIV_ALLOWED_ORIGINS
        value: https://sevbarv.github.io
